[project]
name = "kto-titanic"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn==1.6.1",
    "pandas==2.2.3",
    "joblib==1.4.2",
    "fire==0.7.0",
]

[project.scripts]
api = "titanic.api.main:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",
]
training = [
    "mlflow[extras]==3.8.1",
    "setuptools>=69.0.0",
]
api = [
    "fastapi>=0.119.0",
    "uvicorn>=0.37.0",
    "pyjwt[crypto]>=2.8.0",
    "opentelemetry-api>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-exporter-otlp>=1.41.1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titanic"]
