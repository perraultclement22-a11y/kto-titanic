[project]
name = "kto-titanic"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn==1.6.1",
    "pandas==2.2.3",
    "joblib==1.4.2",
    "fire==0.7.0",
]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=7.0.0",
]
training = [
    "mlflow[extras]==3.8.1",
    "setuptools>=82.0.1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titanic"]
